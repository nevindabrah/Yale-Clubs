<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ClubTable">
  <title>ClubTable</title>
  <defs>
    <linearGradient id="ct-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00356b"/>
      <stop offset="55%" stop-color="#14508f"/>
      <stop offset="100%" stop-color="#2d6cc0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="15" fill="url(#ct-bg)"/>

  <!-- Three people seated around a round table: the product name, drawn. -->
  <circle cx="32" cy="32" r="9.5" fill="none" stroke="#ffffff" stroke-width="3.2" opacity="0.55"/>

  <g stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" opacity="0.9">
    <path d="M32 22.5 L32 20"/>
    <path d="M40.2 36.8 L42.3 38"/>
    <path d="M23.8 36.8 L21.7 38"/>
  </g>

  <circle cx="32" cy="16.5" r="6.2" fill="#ffffff"/>
  <circle cx="45.4" cy="39.8" r="6.2" fill="#cfe2f8"/>
  <circle cx="18.6" cy="39.8" r="6.2" fill="#a9cbf0"/>
</svg>
